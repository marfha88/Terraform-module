name: Terraform Module CI

on:
  pull_request:
    paths:
      - "modules/**"
      - "examples/**"
  push:
    paths:
      - "modules/**"
      - "examples/**"

jobs:
  discover:
    name: Discover Modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.set-matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover module directories
        id: set-matrix
        run: |
          modules=$(find modules -mindepth 1 -maxdepth 1 -type d | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  validate-modules:
    name: Validate Module
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.module }}

      - name: terraform init
        run: terraform init -backend=false
        working-directory: ${{ matrix.module }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ matrix.module }}

  validate-examples:
    name: Validate Example
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Check if example exists
        id: check-example
        run: |
          module_name=$(basename "${{ matrix.module }}")
          example_dir="examples/$module_name"
          if [ -d "$example_dir" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "example_dir=$example_dir" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: terraform fmt check
        if: steps.check-example.outputs.exists == 'true'
        run: terraform fmt -check -recursive
        working-directory: ${{ steps.check-example.outputs.example_dir }}

      - name: terraform init
        if: steps.check-example.outputs.exists == 'true'
        run: terraform init -backend=false
        working-directory: ${{ steps.check-example.outputs.example_dir }}

      - name: terraform validate
        if: steps.check-example.outputs.exists == 'true'
        run: terraform validate
        working-directory: ${{ steps.check-example.outputs.example_dir }}
